[package]
name = "s68k"
version = "4.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bitflags = {version = "2.6.0", features = ["serde"]}
wasm-bindgen = { version = "0.2.92" , features=["serde-serialize"]}
# The WebAssembly boundary only: `assemble` is handed a JavaScript object of
# path -> string | Uint8Array and has to walk it. js-sys is already in the tree
# as serde-wasm-bindgen's own dependency, so this adds nothing to the build but
# the right to name `Object::entries` and `Uint8Array`.
js-sys = "0.3.69"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
console_error_panic_hook = { version = "0.1.7", optional = true }
# The command line front end only: `Term` reads a key in `--step` mode.
console = "0.15.8"

[profile.release]
opt-level = 3
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-O4",
    "--flexible-inline-max-function-size",
    "4294967295",
]

[features]
default = ["console_error_panic_hook"]
# The conformance harness, `src/conformance/`: `Interpreter::from_state`,
# `Interpreter::from_image`, the reader of the SingleStepTests/m68000 files and
# the runner with its skip list (ADR 0010). It is for tests and adds nothing to
# the WebAssembly build. The crate's own tests have it without the feature, so
# `cargo test` runs the vendored subset; the feature is for outside callers.
conformance = []
# The differential harness of the 68010 dialect, `src/conformance/musashi.rs`:
# Musashi (MIT), fetched by scripts/fetch-musashi.sh and compiled by build.rs
# with the `cc` crate, runs beside the Interpreter instruction by instruction.
# For the host's tests only: it compiles C, which the WebAssembly build never
# needs, and nothing fetches or compiles Musashi without it.
musashi = ["conformance", "dep:cc"]
# The cycles of the same harness, `src/conformance/moira.rs`: Moira (MIT), a
# 68010 that counts its cycles access by access and is checked against
# cputester, fetched by scripts/fetch-moira.sh and compiled by build.rs as
# C++20. For the host's tests only, as `musashi` is.
moira = ["conformance", "dep:cc"]

[dev-dependencies]
# Pinned exactly: the committed snapshots are this version's file format, and
# CI resolves dependencies fresh (Cargo.lock is not tracked for this library).
insta = { version = "=1.48.0", features = ["json"] }
# Test only, and already in the tree through insta's "json" feature: the
# Assembler's Diagnostics are serialised for the TypeScript side, and their
# shape is asserted as data rather than as a snapshot.
serde_json = "1.0"

[build-dependencies]
# The build script of the `musashi` and `moira` features only.
cc = { version = "1.2", optional = true }
